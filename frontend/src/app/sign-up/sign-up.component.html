<div class="signup-container">
    <mat-card class="signup-card">
      <h2>Create an Account</h2>
      <form>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput type="text" [(ngModel)]="name" name="name" placeholder="Enter your name" />
        </mat-form-field>
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" placeholder="Enter your email" />
        </mat-form-field>
  
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" placeholder="Enter a password" />
        </mat-form-field>
  
        <button mat-raised-button color="primary" (click)="onSignup()">Sign Up</button>
      </form>
    </mat-card>
  </div>

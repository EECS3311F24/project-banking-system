<div class="transactions-container">
  <mat-card class="transactions-card">
    <h4 class="transactions-title">Transaction History</h4>

    <!-- Filters -->
    <div class="filters-container">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filter by Transaction Type</mat-label>
        <mat-select (selectionChange)="applyTypeFilter($event)">
          <mat-option *ngFor="let type of transactionTypes" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Filter by Date</mat-label>
        <input matInput [matDatepicker]="picker" (dateChange)="applyDateFilter($event)" />
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <!-- Transaction Table -->
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="table mat-elevation-z8">
        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let element">
            {{ element.timestamp | date: 'short' }}
          </td>
        </ng-container>

        <!-- Amount Column -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Amount</th>
          <td mat-cell *matCellDef="let element">
            {{ element.amount | currency }}
          </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let element">
            {{ element.description }}
          </td>
        </ng-container>

        <!-- Table Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card>
</div>
